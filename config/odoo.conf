[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

; Master password for the database manager. Override in production.
admin_passwd = change-me-please

db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
list_db = True

; Dev-friendly: disable request time limits. Remove/raise these in production.
limit_time_real = 0
limit_time_cpu = 0
